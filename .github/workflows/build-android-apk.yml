name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: time80-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No release APK was produced."
            exit 1
          fi
          cp "$APK" "dist/Time80-v0.1.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Time80-v0.1-APK
          path: dist/Time80-v0.1.apk
          if-no-files-found: error
          retention-days: 14
